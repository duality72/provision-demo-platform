name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Runs on every PR so the required `terraform-plan` check always reports.
  # Only decides whether Terraform-relevant files changed; needs no AWS access.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      tf: ${{ steps.filter.outputs.tf }}
    steps:
      - name: Detect Terraform-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tf=false
          # previous_filename is included so a file moved out of these paths still counts.
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          while IFS= read -r f; do
            case "$f" in
              terraform/*|connectors/*) tf=true ;;
            esac
          done <<< "$files"
          echo "tf=$tf" >> "$GITHUB_OUTPUT"

  # Required status check. When `changes` finds no Terraform paths this job is
  # skipped, and a skipped job reports as successful to required status checks.
  terraform-plan:
    name: terraform-plan
    needs: changes
    if: needs.changes.outputs.tf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: |
          set -o pipefail
          terraform plan -var-file=ci.tfvars -no-color -out=plan.out 2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-plan
          message: |
            ### Terraform Plan: `terraform/`
            ```
            ${{ steps.plan.outputs.stdout }}
            ```
